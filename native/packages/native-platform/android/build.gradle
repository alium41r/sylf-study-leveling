plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'study.sylf.native'
version = '0.0.0'

android {
  namespace "expo.modules.sylfnativeplatform"
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
  }
}

dependencies {
  // PathParser draws the web's SVG stroke outlines (Phase 14 ink view).
  implementation "androidx.core:core-ktx:1.13.1"
}
