- insert:
    - id: mcp-supabase
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: supabase
        transport: stdio
        command: npx
        args:
          - '-y'
          - '@supabase/mcp-server-supabase@0.11.0'
          - '--project-ref'
          - 'gjkwkdqdoekzllmnsejo'
        env:
          SUPABASE_ACCESS_TOKEN: !!js process.env.SUPABASE_ACCESS_TOKEN